name: 'GitNexus Review'
description: 'Posts a GitNexus blast-radius review comment on the PR by calling the GitNexus Enterprise Hub.'
author: 'Akon Labs'
inputs:
  hub-url:
    description: 'GitNexus Hub base URL (e.g. https://app.akonlabs.com). Required, no default, so users cannot accidentally hit a wrong server.'
    required: true
  token:
    description: 'GitNexus CI token (gnx_...). Store as a repo secret (e.g. GITNEXUS_TOKEN) and pass via the workflow.'
    required: true
  github-token:
    description: 'GitHub token used to post the PR comment. Defaults to the auto-issued workflow token.'
    required: false
    default: ${{ github.token }}
outputs:
  comment-id:
    description: 'GitHub comment id we created or updated.'
  blast-level:
    description: 'Overall blast level returned by the Hub: LOW | MEDIUM | HIGH | CRITICAL.'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'git-pull-request'
  color: 'purple'
