name: 'GitNexus Review'
description: 'Posts a GitNexus blast-radius review comment on the PR by calling the GitNexus Enterprise Hub.'
author: 'Akon Labs'
inputs:
  hub-url:
    description: 'GitNexus Hub base URL (e.g. https://app.akonlabs.com). Required, no default, so users cannot accidentally hit a wrong server.'
    required: true
  token:
    description: 'GitNexus CI token (gnx_...). Store as a repo secret (e.g. GITNEXUS_TOKEN) and pass via the workflow.'
    required: true
  github-token:
    description: 'GitHub token used to post the PR comment. Defaults to the auto-issued workflow token.'
    required: false
    default: ${{ github.token }}
  fail-on-blast-level:
    description: 'Optional gate. Accepts LOW | MEDIUM | HIGH | CRITICAL. When set, the action fails the workflow if the PR blast level meets or exceeds this value (after posting the comment). Empty (default) is advisory and never fails.'
    required: false
    default: ''
  inline-findings:
    description: 'Opt-in inline review findings. When "true", the action posts line-anchored PR review comments for GitNexus findings (in addition to the main comment) and, while enabled, stays silent on draft PRs until they are marked ready. Default "false" keeps the pre-existing behavior unchanged.'
    required: false
    default: 'false'
  max-inline-findings:
    description: 'Cap on the number of inline review comments posted per run (narrowing only — never surfaces more than the Hub sent). Default 10.'
    required: false
    default: '10'
  inline-severity-floor:
    description: 'Minimum severity for an inline review comment: info | warning | error (narrowing only). "error" posts only error-severity findings inline; "info" additionally posts nits (minor real defects, not style preferences). Default "warning", so nits are opt-in.'
    required: false
    default: 'warning'
outputs:
  comment-id:
    description: 'GitHub comment id we created or updated.'
  blast-level:
    description: 'Overall blast level returned by the Hub: LOW | MEDIUM | HIGH | CRITICAL.'
  gate-decision:
    description: 'Gate outcome: pass | fail | neutral. neutral means the gate was advisory (no fail-on-blast-level set).'
  inline-findings-posted:
    description: 'Number of inline review comments posted or updated this run (0 when inline-findings is off).'
  inline-findings-suppressed:
    description: 'Number of findings not surfaced inline: the Hub noise-budget suppressions plus any narrowed by the severity floor (0 when inline-findings is off). Over-cap findings are demoted to the fallback section, not suppressed.'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'git-pull-request'
  color: 'purple'
