name: 'GitNexus Prep'
description: 'Bundles, computes Context Pack, and emits artifacts for Claude PR review.'
author: 'GitNexus'
inputs:
  hub-url:
    description: 'GitNexus Hub base URL (e.g. https://hub.gitnexus.io). Required — no default so users cannot accidentally hit a wrong server. The `gnx install-ci` CLI always renders this explicitly into the workflow YAML.'
    required: true
  token:
    description: 'GitNexus CI token (gnx_...)'
    required: true
  deep-review-label:
    description: 'PR label that forces a full reindex (skips lazy path).'
    required: false
    default: 'gitnexus-deep-review'
  lazy-reindex:
    description: 'Whether to skip reindex on small diffs without renames or the deep-review label.'
    required: false
    default: 'true'
outputs:
  context-pack-path:
    description: 'Absolute path to context-pack.json'
  system-prompt-path:
    description: 'Absolute path to system-prompt.md'
  mcp-config-path:
    description: 'Absolute path to .claude/gitnexus-mcp.json'
  indexed-commit:
    description: 'Commit SHA the PR-graph was indexed at. Empty when reindex was skipped (lazy path).'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'git-pull-request'
  color: 'purple'
