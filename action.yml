name: 'GitNexus Checks'
description: 'Run graph-derived checks against your PR.'
author: 'GitNexus'
inputs:
  hub-url:
    description: 'GitNexus Hub base URL'
    required: false
    default: 'https://hub.gitnexus.io'
  token:
    description: 'GitNexus API token (from Hub settings)'
    required: true
  pr-comment:
    description: 'Whether to post a PR comment with results'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token used to post the PR comment. Defaults to the workflow-injected token (github.token), which is sufficient as long as the workflow has permissions: pull-requests: write.'
    required: false
    default: ${{ github.token }}
  coverage-file:
    description: 'Path to coverage file (lcov.info, coverage.xml, etc.). Auto-detected from common locations when omitted.'
    required: false
  coverage-format:
    description: 'Coverage format hint: auto, lcov, cobertura, jacoco. Default auto.'
    required: false
    default: 'auto'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'check-circle'
  color: 'purple'
