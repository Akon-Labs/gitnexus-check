<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 536" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="lanGithub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="lanApp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="lanHub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#FDA4AF"/>
    </linearGradient>
    <linearGradient id="lanGate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="536" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="520" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#f8fafc">From install to merge gate</text>
  <text x="520" y="68" text-anchor="middle" font-size="14" font-style="italic" fill="#cbd5e1">What the GitNexus App does, and exactly where it shows up.</text>

  <!-- ── Stage row ─────────────────────────────────────────── -->

  <!-- Stage 1: Install -->
  <rect x="30" y="100" width="210" height="96" rx="10" fill="#1e293b" stroke="url(#lanGithub)" stroke-width="1.5"/>
  <circle cx="54" cy="126" r="13" fill="url(#lanGithub)"/>
  <text x="54" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1120">1</text>
  <text x="135" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Install the App</text>
  <text x="135" y="176" text-anchor="middle" font-size="12.5" fill="#94a3b8">one click, org wide</text>

  <!-- Stage 2: Index -->
  <rect x="285" y="100" width="210" height="96" rx="10" fill="#1e293b" stroke="url(#lanApp)" stroke-width="1.5"/>
  <circle cx="309" cy="126" r="13" fill="url(#lanApp)"/>
  <text x="309" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1120">2</text>
  <text x="390" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Add your repos</text>
  <text x="390" y="170" text-anchor="middle" font-size="12" fill="#94a3b8">on app.akonlabs.com</text>
  <text x="390" y="187" text-anchor="middle" font-size="12" fill="#94a3b8">the Hub builds your code graph</text>

  <!-- Stage 3: Open PR -->
  <rect x="540" y="100" width="210" height="96" rx="10" fill="#1e293b" stroke="url(#lanHub)" stroke-width="1.5"/>
  <circle cx="564" cy="126" r="13" fill="url(#lanHub)"/>
  <text x="564" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1120">3</text>
  <text x="645" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Open a PR</text>
  <text x="645" y="176" text-anchor="middle" font-size="12.5" fill="#94a3b8">webhook fires, analysis starts</text>

  <!-- Stage 4: Analysis -->
  <rect x="795" y="100" width="210" height="96" rx="10" fill="#1e293b" stroke="url(#lanGate)" stroke-width="1.5"/>
  <circle cx="819" cy="126" r="13" fill="url(#lanGate)"/>
  <text x="819" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1120">4</text>
  <text x="900" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Graph analysis</text>
  <text x="900" y="170" text-anchor="middle" font-size="12" fill="#94a3b8">blast radius · dependents</text>
  <text x="900" y="187" text-anchor="middle" font-size="12" fill="#94a3b8">cross-repo · plain summary</text>

  <!-- Stage arrows -->
  <line x1="240" y1="148" x2="278" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="495" y1="148" x2="533" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="750" y1="148" x2="788" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- ── Fan-out spine ─────────────────────────────────────── -->
  <line x1="900" y1="196" x2="900" y2="232" stroke="#475569" stroke-width="2"/>
  <line x1="185" y1="232" x2="900" y2="232" stroke="#475569" stroke-width="2"/>
  <line x1="185" y1="232" x2="185" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="520" y1="232" x2="520" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="855" y1="232" x2="855" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- ── Outcome cards ─────────────────────────────────────── -->

  <!-- Card A: check run -->
  <rect x="30" y="272" width="310" height="210" rx="12" fill="#111a2c" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="42" y="284" width="286" height="34" rx="8" fill="url(#lanGithub)"/>
  <text x="185" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1120">The check run</text>
  <text x="185" y="340" text-anchor="middle" font-size="12" font-style="italic" fill="#94a3b8">lives in the Checks tab</text>
  <circle cx="56" cy="366" r="3" fill="#38BDF8"/>
  <text x="70" y="371" font-size="13" fill="#e2e8f0">a verdict from LOW to CRITICAL</text>
  <circle cx="56" cy="398" r="3" fill="#38BDF8"/>
  <text x="70" y="403" font-size="13" fill="#e2e8f0">annotations on risky changed lines</text>
  <circle cx="56" cy="430" r="3" fill="#38BDF8"/>
  <text x="70" y="435" font-size="13" fill="#e2e8f0">mark it required to gate merges</text>

  <!-- Card B: review comment -->
  <rect x="365" y="272" width="310" height="210" rx="12" fill="#111a2c" stroke="#0D9488" stroke-width="1.5"/>
  <rect x="377" y="284" width="286" height="34" rx="8" fill="url(#lanApp)"/>
  <text x="520" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1120">The review comment</text>
  <text x="520" y="340" text-anchor="middle" font-size="12" font-style="italic" fill="#94a3b8">lives in the PR conversation</text>
  <circle cx="391" cy="366" r="3" fill="#2DD4BF"/>
  <text x="405" y="371" font-size="13" fill="#e2e8f0">what the change is, in plain words</text>
  <circle cx="391" cy="398" r="3" fill="#2DD4BF"/>
  <text x="405" y="403" font-size="13" fill="#e2e8f0">cross-repo impact by consumer repo</text>
  <circle cx="391" cy="430" r="3" fill="#2DD4BF"/>
  <text x="405" y="435" font-size="13" fill="#e2e8f0">full graph report collapsed below</text>

  <!-- Card C: every push -->
  <rect x="700" y="272" width="310" height="210" rx="12" fill="#111a2c" stroke="#FB7185" stroke-width="1.5"/>
  <rect x="712" y="284" width="286" height="34" rx="8" fill="url(#lanHub)"/>
  <text x="855" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1120">Every new push</text>
  <text x="855" y="340" text-anchor="middle" font-size="12" font-style="italic" fill="#94a3b8">same PR, next commit</text>
  <circle cx="726" cy="366" r="3" fill="#FDA4AF"/>
  <text x="740" y="371" font-size="13" fill="#e2e8f0">a fresh check run on each commit</text>
  <circle cx="726" cy="398" r="3" fill="#FDA4AF"/>
  <text x="740" y="403" font-size="13" fill="#e2e8f0">a since-last-commit summary note</text>
  <circle cx="726" cy="430" r="3" fill="#FDA4AF"/>
  <text x="740" y="435" font-size="13" fill="#e2e8f0">Re-run recovers any stuck check</text>

  <!-- Footer -->
  <text x="520" y="518" text-anchor="middle" font-size="11.5" fill="#64748b">GitNexus · Akon Labs</text>
</svg>
